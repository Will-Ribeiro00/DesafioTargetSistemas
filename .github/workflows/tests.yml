name: Tests

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "src/frontend/**"
      - "especificacoes/**"
      - "**.md"
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DesafioTargetSistemas.slnx

      - name: Build
        run: dotnet build DesafioTargetSistemas.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DesafioTargetSistemas.slnx --no-build --configuration Release --verbosity normal
